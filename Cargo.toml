[package]
name = "snapper"
version = "1.5.0"
edition = "2021"
build = "build.rs"
description = "Snapper: a lightweight region screenshot tool that lives in the tray"

[[bin]]
name = "Snapper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard", "links"] }
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
jpeg-encoder = "0.6"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Foundation_Numerics",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "System_UserProfile",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
dirs = "7.0.0"
libc = "0.2"
tray-icon = "0.21"
global-hotkey = "0.7"
gtk = "0.18"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
x11rb = { version = "0.13", features = ["randr"] }
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
pollster = "0.4"
tiny-skia = "0.11"
ab_glyph = "0.2"
notify-rust = "4"
futures-util = "0.3"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
